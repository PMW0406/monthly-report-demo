<style>
html{color-scheme:light;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f4f6f9;color:#1c2534;font-size:14px}
#side{position:fixed;top:0;left:0;bottom:0;width:224px;background:#0f2544;color:#c9d6e6;display:flex;flex-direction:column;z-index:50}
#main{margin-left:224px;min-height:100vh;display:flex;flex-direction:column}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:-.02em}
.brand small{color:#7d94b0;font-size:11px}
.nav{flex:1;padding:10px;overflow-y:auto}
.nav .grp{font-size:10px;font-weight:700;letter-spacing:.12em;color:#5f7791;margin:14px 10px 5px}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;font-size:13px;color:#c9d6e6;cursor:pointer;margin-bottom:1px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:#2563eb;color:#fff;font-weight:600}
.side-foot{padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#5f7791;line-height:1.6}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid #e3e9f1;padding:13px 26px;display:flex;align-items:flex-end;gap:14px}
.topbar h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{font-size:12px;color:#7183a0;padding-bottom:1px}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.mon{background:#eef3fa;border:1px solid #d5e0ef;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#1e3a5f}
.pbtn{background:#fff;border:1px solid #d5dee9;border-radius:8px;padding:6px 12px;font-size:12px;color:#475569;cursor:pointer}
.pbtn:hover{background:#f2f6fb}
.wrap{flex:1;padding:22px 30px 40px;max-width:1640px;width:100%}
.page{display:none}.page.on{display:block}
.card{background:#fff;border:1px solid #e2e8f1;border-radius:12px;padding:20px 22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,37,68,.04)}
.card h2{margin:0 0 5px;font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.card .desc{font-size:12.5px;color:#7183a0;margin-bottom:14px}
.hl{background:#f0f6ff;border:1px solid #d3e3fb;border-radius:10px;padding:15px 19px;font-size:14.5px;margin-bottom:18px;line-height:1.75}
.hl b{color:#1d4ed8}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid #e2e8f1;border-radius:12px;padding:17px 19px}
.kpi .l{font-size:12px;font-weight:700;color:#7183a0}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 3px;white-space:nowrap}
.kpi .s{font-size:12px;color:#8fa0b8}
.up{color:#16a34a}.dn{color:#dc2626}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{background:#f6f8fb;color:#5b6b82;font-weight:700;font-size:12.5px;padding:10px 12px;border-bottom:1px solid #e2e8f1;text-align:right;white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left}
.t td{padding:9px 12px;border-bottom:1px solid #f0f3f8;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.sec>td{background:#fbfcfe;font-weight:800}
.t tr.sub>td:first-child{padding-left:22px;color:#475569}
.t tr:hover td{background:#f8fafd}
.neg{color:#dc2626}
.tot td{border-top:2px solid #d7dfea;font-weight:800;background:#fbfcfe}
.note{font-size:12px;color:#8797ad;line-height:1.75;margin-top:12px}
.note b{color:#5b6b82}
.tscroll{overflow-x:auto}
.tabrow{display:flex;gap:6px;margin-bottom:14px}
.tab{border:1px solid #d5dee9;background:#fff;border-radius:8px;padding:7px 16px;font-size:12.5px;font-weight:600;color:#475569;cursor:pointer}
.tab.on{background:#1e3a5f;border-color:#1e3a5f;color:#fff}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.mini{display:flex;align-items:flex-end;gap:18px;height:168px;padding:8px 4px 0}
.mini .mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.mini .bars{width:100%;display:flex;align-items:flex-end;justify-content:center;gap:7px;height:126px}
.mini .b{width:34px;border-radius:3px 3px 0 0}
.mini .lb{font-size:12px;color:#7183a0;font-weight:600}
.mini .vv{font-size:12px;font-weight:800;color:#1e3a5f;white-space:nowrap}
.lgd{font-size:11px;color:#94a3b8;align-self:flex-start;padding-top:4px;line-height:1.7}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
@media(min-width:1500px){
  table.t{font-size:14px}
  .t td{padding:10px 13px}
  .kpi .v{font-size:28px}
  .card{padding:22px 24px}
  .hl{font-size:15px}
}
@media print{#side,.topbar .right{display:none}#main{margin-left:0}.page{display:block!important;page-break-after:always}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
@media(max-width:900px){#side{transform:translateX(-100%)}#main{margin-left:0}.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.duo{grid-template-columns:1fr}}

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// 숫자: 음수는 회계식 (1,234) 빨강. 문자열이면 그대로 표시(단위·기호 포함 가능)
function num(v){
  if(v==null||v==='') return '';
  if(typeof v==='string') return esc(v);
  return v<0?'<span class="neg">('+Math.abs(v).toLocaleString()+')</span>':v.toLocaleString();
}
// 한 칸에 두 값 병기(예: 매출/영업이익)
const pair=a=>(!a||(a[0]==null&&a[1]==null))?'':(num(a[0])+' / '+num(a[1]));
const cell=v=>Array.isArray(v)?pair(v):num(v);
const rowCls=f=>f===1?'sub':(f===2?'tot':(f===0?'sec':''));

function secHTML(s){
  if(!s) return '';
  switch(s.type){
    case 'hl':   return '<div class="hl">'+(s.html||esc(s.text))+'</div>';
    case 'kpi':  return '<div class="kgrid">'+(s.items||[]).map(k=>
                   '<div class="kpi"><div class="l">'+esc(k.l)+'</div><div class="v">'+esc(k.v)+'</div><div class="s">'+(k.sHtml||esc(k.s||''))+'</div></div>').join('')+'</div>';
    case 'table':return card(s, tableHTML(s));
    case 'bars': return card(s, barsHTML(s));
    case 'duo':  return '<div class="duo"><div>'+(s.left||[]).map(secHTML).join('')+'</div><div>'+(s.right||[]).map(secHTML).join('')+'</div></div>';
    case 'tabs': return tabsHTML(s);
    default:     return '';
  }
}
function card(s,inner){
  return '<div class="card">'+(s.title?'<h2>'+esc(s.title)+'</h2>':'')
    +(s.desc?'<div class="desc">'+esc(s.desc)+'</div>':'')+inner
    +(s.note?'<div class="note">'+(s.noteHtml||esc(s.note))+'</div>':'')+'</div>';
}
function tableHTML(s){
  const head=(s.head||[]).map(h=>'<th>'+esc(h)+'</th>').join('');
  const body=(s.rows||[]).map(r=>{
    const c=Array.isArray(r)?r:r.c||[];
    const tds=c.map((v,i)=>'<td>'+(i===0?'<b>'+esc(v)+'</b>':cell(v))+'</td>').join('');
    return '<tr'+(rowCls(Array.isArray(r)?null:r.flag)?' class="'+rowCls(r.flag)+'"':'')+'>'+tds+'</tr>';
  }).join('');
  return '<div class="tscroll"><table class="t">'+(head?'<tr>'+head+'</tr>':'')+body+'</table></div>';
}
function barsHTML(s){
  const ser=s.series||[], lg=s.legend||[], col=s.colors||['#2563eb','#16a34a'];
  let mx=1; ser.forEach(r=>r.slice(1).forEach(v=>{ if(typeof v==='number') mx=Math.max(mx,Math.abs(v)); }));
  const cols=ser.map(r=>{
    const vals=r.slice(1);
    return '<div class="mcol"><div class="vv">'+vals.map(v=>num(v)).join(' / ')+'</div><div class="bars">'
      +vals.map((v,i)=>'<div class="b" style="height:'+Math.max(3,Math.round(Math.max(v,0)/mx*120))+'px;background:'+(col[i]||'#94a3b8')+'"></div>').join('')
      +'</div><div class="lb">'+esc(r[0])+'</div></div>';
  }).join('');
  const legend=lg.length?'<div class="lgd">'+lg.map((t,i)=>'<i style="background:'+(col[i]||'#94a3b8')+'"></i>'+esc(t)).join('<br>')+'</div>':'';
  return '<div class="mini">'+cols+legend+'</div>';
}
function tabsHTML(s){
  const id='tb'+Math.random().toString(36).slice(2,8);
  const btns=(s.tabs||[]).map((t,i)=>'<button class="tab'+(i===0?' on':'')+'" data-i="'+i+'">'+esc(t.label)+'</button>').join('');
  const bodies=(s.tabs||[]).map((t,i)=>'<div data-i="'+i+'" style="display:'+(i===0?'block':'none')+'">'+(t.sections||[]).map(secHTML).join('')+'</div>').join('');
  setTimeout(()=>{ const el=document.getElementById(id); if(!el)return;
    el.addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b)return;
      el.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
      el.querySelectorAll('[data-i][style]').forEach(d=>{ d.style.display=(d.dataset.i===b.dataset.i)?'block':'none'; }); });
  },0);
  return '<div id="'+id+'"><div class="tabrow">'+btns+'</div>'+bodies+'</div>';
}

  const first=menu[0]; if(first) document.getElementById('pg-title').textContent=first.label;
  nav.addEventListener('click',e=>{ const a=e.target.closest('a[data-p]'); if(!a)return;
    nav.querySelectorAll('a').forEach(x=>x.classList.toggle('on',x===a));
    wrap.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='page-'+a.dataset.p));
    const mm=menu.find(x=>x.id===a.dataset.p); document.getElementById('pg-title').textContent=mm?mm.label:'';
    window.scrollTo(0,0); });
}
render();
</script>
</body>
</html>
